<script>

const SUPABASE_URL = "https://fnyxxyohuywtatbjagyc.supabase.co";

const SUPABASE_KEY = "sb_publishable_A3iHoZiiPZhPyTUDUDCfZ_QG0u6xvxj";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function adminLogin() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logging in...";
  message.className = "";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.textContent = error.message;
    message.className = "error";
    return;
  }

  const user = data.user;

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

  if (
    profileError ||
    !profile ||
    profile.role !== "admin"
  ) {

    await supabaseClient.auth.signOut();

    message.textContent =
      "Access denied. Admin account required.";

    message.className = "error";

    return;
  }

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  await loadUsers();
}


async function loadUsers() {

  const select =
    document.getElementById("userSelect");

  const subtractSelect =
    document.getElementById("subtractUserSelect");

  if (!select) {
    console.error("userSelect not found");
    return;
  }

  if (!subtractSelect) {
    console.error("subtractUserSelect not found");
    return;
  }


  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id, display_name, email")
      .order("display_name");


  if (error) {

    console.error(error);

    return;
  }


  select.innerHTML =
    '<option value="">Select user</option>';

  subtractSelect.innerHTML =
    '<option value="">Select user</option>';


  data.forEach(user => {

    const userText =
      (user.display_name || "OEX User") +
      " — " +
      (user.email || "No email");


    const addOption =
      document.createElement("option");

    addOption.value = user.id;

    addOption.textContent = userText;

    select.appendChild(addOption);


    const subtractOption =
      document.createElement("option");

    subtractOption.value = user.id;

    subtractOption.textContent = userText;

    subtractSelect.appendChild(subtractOption);

  });
}


async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("adminPanel")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");
}


async function addBalance() {

  const userId =
    document.getElementById("userSelect").value;

  const coinSymbol =
    document.getElementById("coinType").value;

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const message =
    document.getElementById("balanceMessage");


  if (!userId) {

    message.textContent =
      "Please select a user.";

    message.className = "error";

    return;
  }


  if (!amount || amount <= 0) {

    message.textContent =
      "Enter a valid amount.";

    message.className = "error";

    return;
  }


  message.textContent =
    "Adding balance...";

  message.className = "";


  const { data: coin, error: coinError } =
    await supabaseClient
      .from("coins")
      .select("id")
      .eq("symbol", coinSymbol)
      .single();


  if (coinError || !coin) {

    message.textContent =
      "Coin not found.";

    message.className = "error";

    return;
  }


  const {
    data: existingBalance,
    error: balanceError
  } =
    await supabaseClient
      .from("balances")
      .select("id, amount")
      .eq("user_id", userId)
      .eq("coin_id", coin.id)
      .maybeSingle();


  if (balanceError) {

    message.textContent =
      balanceError.message;

    message.className = "error";

    return;
  }


  if (existingBalance) {

    const newAmount =
      Number(existingBalance.amount) +
      amount;


    const {
      data: updatedBalance,
      error
    } =
      await supabaseClient
        .from("balances")
        .update({
          amount: newAmount,
          updated_at:
            new Date().toISOString()
        })
        .eq(
          "id",
          existingBalance.id
        )
        .select()
        .single();


    if (error || !updatedBalance) {

      message.textContent =
        error?.message ||
        "Balance update failed.";

      message.className = "error";

      return;
    }

  } else {

    const { error } =
      await supabaseClient
        .from("balances")
        .insert({
          user_id: userId,
          coin_id: coin.id,
          amount: amount
        });


    if (error) {

      message.textContent =
        error.message;

      message.className = "error";

      return;
    }
  }


  message.textContent =
    "Balance added successfully: " +
    amount +
    " " +
    coinSymbol;

  message.className = "success";


  document.getElementById("amount").value = "";
}


/* ================================
   SUBTRACT BALANCE
================================ */

async function subtractBalance() {

  const userId =
    document
      .getElementById("subtractUserSelect")
      .value;


  const coinSymbol =
    document
      .getElementById("subtractCoinType")
      .value;


  const amount =
    Number(
      document
        .getElementById("subtractAmount")
        .value
    );


  const message =
    document
      .getElementById(
        "subtractBalanceMessage"
      );


  if (!userId) {

    message.textContent =
      "Please select a user.";

    message.className = "error";

    return;
  }


  if (!amount || amount <= 0) {

    message.textContent =
      "Enter a valid amount.";

    message.className = "error";

    return;
  }


  message.textContent =
    "Checking balance...";

  message.className = "";


  const {
    data: coin,
    error: coinError
  } =
    await supabaseClient
      .from("coins")
      .select("id")
      .eq("symbol", coinSymbol)
      .single();


  if (coinError || !coin) {

    message.textContent =
      "Coin not found.";

    message.className = "error";

    return;
  }


  const {
    data: existingBalance,
    error: balanceError
  } =
    await supabaseClient
      .from("balances")
      .select("id, amount")
      .eq("user_id", userId)
      .eq("coin_id", coin.id)
      .maybeSingle();


  if (balanceError) {

    message.textContent =
      balanceError.message;

    message.className = "error";

    return;
  }


  if (!existingBalance) {

    message.textContent =
      "This user does not have a " +
      coinSymbol +
      " balance.";

    message.className = "error";

    return;
  }


  const currentBalance =
    Number(existingBalance.amount);


  if (amount > currentBalance) {

    message.textContent =
      "Insufficient balance. Current balance: " +
      currentBalance +
      " " +
      coinSymbol;

    message.className = "error";

    return;
  }


  const newBalance =
    currentBalance - amount;


  const { error: updateError } =
    await supabaseClient
      .from("balances")
      .update({
        amount: newBalance,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        existingBalance.id
      );


  if (updateError) {

    message.textContent =
      updateError.message;

    message.className = "error";

    return;
  }


  message.textContent =
    "Successfully deducted " +
    amount +
    " " +
    coinSymbol +
    ". New balance: " +
    newBalance +
    " " +
    coinSymbol;

  message.className = "success";


  document
    .getElementById("subtractAmount")
    .value = "";
}

</script>
