<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEX Admin Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #151b2e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #30384f;
      background: #0b1020;
      color: white;
    }

    button {
      background: #2563eb;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .muted {
      color: #9ca3af;
    }

    .success {
      color: #22c55e;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginCard" class="card">
    <h2>OEX Admin Login</h2>

    <input id="email" type="email" placeholder="Admin email">

    <input id="password" type="password" placeholder="Password">

    <button onclick="adminLogin()">Login</button>

    <p id="loginMessage"></p>
  </div>


  <div id="adminPanel" class="hidden">

    <div class="card">
      <h2>OEX Admin Panel</h2>
      <p class="muted">Manage user balances</p>

      <button onclick="logout()">Logout</button>
    </div>


    <div class="card">
      <h3>Add Balance to User</h3>

      <input
        id="userEmail"
        type="email"
        placeholder="User email"
      >

      <select id="coinType">
        <option value="USDT">USDT</option>
        <option value="ETH">ETH</option>
      </select>

      <input
        id="amount"
        type="number"
        step="0.000001"
        min="0"
        placeholder="Amount"
      >

      <button onclick="addBalance()">
        Add Balance
      </button>

      <p id="balanceMessage"></p>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://fnyxxyohuywtatbjagyc.supabase.co";

/*
  Keep your existing Supabase publishable key
  here from your current dashboard.html.
*/
const SUPABASE_KEY = "A3iHoZiiPZhPyTUDUDCfZQ_G0u6xvxj";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function adminLogin() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.textContent = error.message;
    message.className = "error";
    return;
  }

  const user = data.user;

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

  if (profileError || !profile || profile.role !== "admin") {

    await supabaseClient.auth.signOut();

    message.textContent = "Access denied. Admin account required.";
    message.className = "error";

    return;
  }

  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
}


async function addBalance() {

  const email =
    document.getElementById("userEmail").value.trim();

  const coinSymbol =
    document.getElementById("coinType").value;

  const amount =
    Number(document.getElementById("amount").value);

  const message =
    document.getElementById("balanceMessage");

  if (!email || !amount || amount <= 0) {
    message.textContent =
      "Enter a user email and a valid amount.";
    message.className = "error";
    return;
  }

  message.textContent = "Processing...";

  const { data: userData, error: userError } =
    await supabaseClient
      .from("profiles")
      .select("id")
      .eq("id", "00000000-0000-0000-0000-000000000000")
      .limit(1);

  /*
    User lookup and balance updates will be connected
    after we confirm the admin login works.
  */

  message.textContent =
    "Admin login is working. Balance management will be connected next.";

  message.className = "success";
}

</script>

</body>
</html>
