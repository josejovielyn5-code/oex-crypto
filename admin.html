<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEX TEST</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 20px;
      background: #11182d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #4da3ff;
    }

    button {
      background: #4da3ff;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #11182d;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .muted {
      color: #9aa4bd;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #55d68a;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OEX Admin</div>
  <button onclick="logout()">Log Out</button>
</header>

<main>

  <div class="card">
    <div class="muted">Administrator</div>
    <h1 id="adminName">Checking...</h1>
    <div id="adminEmail" class="muted"></div>
  </div>

  <div class="card">
    <h2>Admin Control Panel</h2>

    <p class="muted">
      You are logged in as an OEX administrator.
    </p>

    <p id="status"></p>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script>
  const SUPABASE_URL = "https://fnyxxyohuywtatbjagyc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "[sb_publishable_A3iHoZiiPZhPyTUDUDCfZQ_G0u6xvxj]";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function checkAdmin() {

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error || !data.session) {
      window.location.href = "/";
      return;
    }

    const user = data.session.user;

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("display_name, role")
        .eq("id", user.id)
        .single();

    if (profileError || !profile || profile.role !== "admin") {
      document.getElementById("status").textContent =
        "Access denied. Administrator access required.";

      document.getElementById("status").className = "error";

      return;
    }

    document.getElementById("adminName").textContent =
      profile.display_name || "OEX Admin";

    document.getElementById("adminEmail").textContent =
      user.email || "";

    document.getElementById("status").textContent =
      "Admin access confirmed.";

    document.getElementById("status").className = "success";
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "/admin.html";
  }

  checkAdmin();
</script>

</body>
</html>
