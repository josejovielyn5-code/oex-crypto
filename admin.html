<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEX Admin Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #151b2e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #30384f;
      background: #0b1020;
      color: white;
    }

    button {
      background: #2563eb;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .muted {
      color: #9ca3af;
    }

    .success {
      color: #22c55e;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginCard" class="card">
    <h2>OEX Admin Login</h2>

    <input id="email" type="email" placeholder="Admin email">

    <input id="password" type="password" placeholder="Password">

    <button onclick="adminLogin()">Login</button>

    <p id="loginMessage"></p>
  </div>


  <div id="adminPanel" class="hidden">
<div class="card">
  <h3>Create User Account</h3>

  <input
    id="newUserName"
    type="text"
    placeholder="Full name"
  >

  <input
    id="newUserEmail"
    type="email"
    placeholder="Email address"
  >

  <input
    id="newUserPassword"
    type="password"
    placeholder="Password"
  >

  <button onclick="createUserAccount()">
    Create User
  </button>

  <p id="createUserMessage"></p>
</div>
    <div class="card">
      <h2>OEX Admin Panel</h2>
      <p class="muted">Manage user balances</p>

      <button onclick="logout()">Logout</button>
    </div>


    <div class="card">
      <h3>Add Balance to User</h3>

      <input
        id="userEmail"
        type="email"
        placeholder="User email"
      >

      <select id="coinType">
        <option value="USDT">USDT</option>
        <option value="ETH">ETH</option>
      </select>

      <input
        id="amount"
        type="number"
        step="0.000001"
        min="0"
        placeholder="Amount"
      >

      <button onclick="addBalance()">
        Add Balance
      </button>

      <p id="balanceMessage"></p>
</div>

<div class="card">
  <h3>ETH Withdrawal Fee</h3>

  <input
    id="ethFee"
    type="number"
    step="0.000001"
    min="0"
    placeholder="ETH fee amount"
  >

  <button onclick="saveEthFee()">
    Save ETH Fee
  </button>

  <p id="ethFeeMessage"></p>
</div>
</div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://fnyxxyohuywtatbjagyc.supabase.co";

/*
  Keep your existing Supabase publishable key
  here from your current dashboard.html.
*/
const SUPABASE_KEY = "sb_publishable_A3iHoZiiPZhPyTUDUDCfZQ_G0u6xvxj";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function adminLogin() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.textContent = error.message;
    message.className = "error";
    return;
  }

  const user = data.user;

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

  if (profileError || !profile || profile.role !== "admin") {

    await supabaseClient.auth.signOut();

    message.textContent = "Access denied. Admin account required.";
    message.className = "error";

    return;
  }

  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  loadUsers();
}

async function loadUsers() {
  const select = document.getElementById("userSelect");

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, display_name, email")
    .order("display_name");

  if (error) {
    console.error(error);
    return;
  }

  select.innerHTML = '<option value="">Select user</option>';

  data.forEach(user => {
    const option = document.createElement("option");
    option.value = user.id;
    option.textContent =
      (user.display_name || "OEX User") +
      " — " +
      (user.email || "No email");

    select.appendChild(option);
  });
}
async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
}
async function createUserAccount() {
  const name = document.getElementById("newUserName").value.trim();
  const email = document.getElementById("newUserEmail").value.trim();
  const password = document.getElementById("newUserPassword").value;
  const message = document.getElementById("createUserMessage");

  if (!name || !email || !password) {
    message.textContent = "Please fill in all fields.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  message.textContent = "Creating user...";

  // Temporary placeholder.
  // The secure account-creation connection will be added next.
  message.textContent = "User form is ready.";
}
async function saveEthFee() {
  const fee = Number(document.getElementById("ethFee").value);
  const message = document.getElementById("ethFeeMessage");

  if (isNaN(fee) || fee < 0) {
    message.textContent = "Enter a valid ETH fee.";
    return;
  }

  message.textContent = "Saving ETH fee...";

  // Fee storage will be connected next.
  message.textContent = "ETH fee entered: " + fee + " ETH";
}
async function addBalance() {
  const userId = document.getElementById("userSelect").value;
  const coinSymbol = document.getElementById("coinType").value;
  const amount = Number(document.getElementById("amount").value);
  const message = document.getElementById("balanceMessage");

  if (!userId) {
    message.textContent = "Please select a user.";
    message.className = "error";
    return;
  }

  if (!amount || amount <= 0) {
    message.textContent = "Enter a valid amount.";
    message.className = "error";
    return;
  }

  message.textContent = "Adding balance...";
  message.className = "";

  const { data: coin, error: coinError } = await supabaseClient
    .from("coins")
    .select("id")
    .eq("symbol", coinSymbol)
    .single();

  if (coinError || !coin) {
    message.textContent = "Coin not found.";
    message.className = "error";
    return;
  }

  const { data: existingBalance, error: balanceError } =
    await supabaseClient
      .from("balances")
      .select("id, amount")
      .eq("user_id", userId)
      .eq("coin_id", coin.id)
      .maybeSingle();

  if (balanceError) {
    message.textContent = balanceError.message;
    message.className = "error";
    return;
  }

  if (existingBalance) {
    const newAmount =
      Number(existingBalance.amount) + amount;

    const { error } = await supabaseClient
      .from("balances")
      .update({
        amount: newAmount,
        updated_at: new Date().toISOString()
      })
      .eq("id", existingBalance.id);

    if (error) {
      message.textContent = error.message;
      message.className = "error";
      return;
    }
  } else {
    const { error } = await supabaseClient
      .from("balances")
      .insert({
        user_id: userId,
        coin_id: coin.id,
        amount: amount
      });

    if (error) {
      message.textContent = error.message;
      message.className = "error";
      return;
    }
  }

  message.textContent =
    "Balance added successfully: " +
    amount +
    " " +
    coinSymbol;

  message.className = "success";

  document.getElementById("amount").value = "";
}

  message.textContent = "Processing...";

  const { data: userData, error: userError } =
    await supabaseClient
      .from("profiles")
      .select("id")
      .eq("id", "00000000-0000-0000-0000-000000000000")
      .limit(1);

  /*
    User lookup and balance updates will be connected
    after we confirm the admin login works.
  */

  message.textContent =
    "Admin login is working. Balance management will be connected next.";

  message.className = "success";
}

</script>

</body>
</html>
