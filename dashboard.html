<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEX Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 20px;
      background: #11182d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #4da3ff;
    }

    button {
      background: #4da3ff;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #11182d;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .muted {
      color: #9aa4bd;
    }

    a {
      color: #4da3ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OEX Crypto</div>
  <button onclick="logout()">Log Out</button>
</header>

<main>

  <div class="card">
    <div class="muted">Welcome</div>
    <h1 id="userName">OEX User</h1>
    <div class="muted" id="userEmail"></div>
  </div>

  <div class="card">
  <div class="muted">USDT Balance</div>
  <div class="balance" id="usdtBalance">0.00 USDT</div>
</div>

  <div class="card">
  <h2>USDT</h2>

  <button onclick="showRecharge()">Recharge</button>
  <button onclick="showWithdrawal()">Withdrawal</button>

  <div id="actionArea" style="margin-top:20px;"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script>
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_PUBLISHABLE_KEY = "YOUR_PUBLISHABLE_KEY";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function loadUser() {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "/oex-crypto/";
      return;
    }

    document.getElementById("userEmail").textContent =
      user.email || "";

    document.getElementById("userName").textContent =
      user.user_metadata?.display_name || "OEX User";
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "/oex-crypto/";
  }

  loadUser();
</script>

</body>
</html>
