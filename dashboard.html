<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OEX Crypto Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #101a2e 0%, #070b14 45%, #050810 100%);
      color: #ffffff;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      min-height: 110px;
      padding: 18px 5%;
      background: rgba(5, 9, 20, 0.96);
      border-bottom: 1px solid #1c2639;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .oex-logo {
      width: 58px;
      height: 58px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);

      gap: 7px;
    }

    .oex-logo span {
      background: #ffffff;
      border-radius: 2px;
    }

    .brand-divider {
      width: 2px;
      height: 55px;
      background: #ffffff;
      opacity: 0.75;
    }

    .brand-name {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .logout-button {
      background: #2787f5;
      border: none;
      color: white;

      padding: 14px 28px;

      border-radius: 11px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .logout-button:hover {
      background: #176ed1;
      transform: translateY(-1px);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 1500px;

      margin: 35px auto;

      padding: 0 35px 50px;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(15, 23, 40, 0.98),
          rgba(7, 12, 23, 0.98)
        );

      border: 1px solid #1d2940;

      border-radius: 17px;

      padding: 28px;

      margin-bottom: 24px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .muted {
      color: #9ca8c2;
    }

    /* =========================
       USER
    ========================= */

    .user-card {
      min-height: 230px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome {
      font-size: 20px;
      color: #9ca8c2;
      margin-bottom: 8px;
    }

    #userName {
      font-size: 55px;
      margin: 0 0 12px;
      letter-spacing: -2px;
    }

    #userEmail {
      font-size: 18px;
    }

    /* =========================
       BALANCES
    ========================= */

    .balance-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 20px;
    }

    .balance-box {
      background: #080e1b;

      border: 1px solid #1c2940;

      border-radius: 14px;

      padding: 25px;
    }

    .balance-label {
      color: #9ca8c2;

      font-size: 17px;

      margin-bottom: 8px;
    }

    .balance {
      font-size: 38px;
      font-weight: 700;
    }

    /* =========================
       ACTIONS
    ========================= */

    .action-header {
      display: flex;
      align-items: center;

      gap: 20px;

      flex-wrap: wrap;
    }

    .usdt-icon {
      width: 62px;
      height: 62px;

      border-radius: 50%;

      background: #19a97b;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 34px;
      font-weight: bold;
    }

    .action-title {
      font-size: 34px;
      font-weight: 700;
    }

    .action-button {
      background: #2787f5;

      border: none;

      color: white;

      padding: 15px 28px;

      border-radius: 11px;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .action-button:hover {
      background: #176ed1;
      transform: translateY(-1px);
    }

    #actionArea {
      margin-top: 25px;

      padding: 22px;

      background: #080e1b;

      border: 1px solid #1c2940;

      border-radius: 14px;
    }

    #actionArea:empty {
      display: none;
    }

    .address-box {
      background: #050a13;

      border: 1px solid #27344c;

      padding: 17px;

      border-radius: 10px;

      word-break: break-all;

      font-family: monospace;

      color: #ffffff;

      margin: 15px 0;
    }

    input {
      width: 100%;

      background: #050a13;

      border: 1px solid #27344c;

      color: white;

      padding: 14px;

      border-radius: 9px;

      margin: 8px 0;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color: #2787f5;
    }

    /* =========================
       REFERRAL
    ========================= */

    .referral-card {
      position: relative;
      overflow: hidden;
    }

    .referral-content {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .referral-icon {
      width: 62px;
      height: 62px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #2787f5;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: 700;
    }

    .referral-text h2 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .referral-text h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .referral-text p {
      margin: 0;
    }

    .referral-link-box {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .referral-link-box input {
      margin: 0;
      flex: 1;
      min-width: 0;
    }

    .referral-link-box .action-button {
      flex-shrink: 0;
      margin: 0;
    }

    .referral-code {
      margin-top: 18px;
      font-size: 16px;
    }

    .referral-code strong {
      color: white;
      margin-left: 6px;
    }

    /* =========================
       MARKET
    ========================= */

    .market-title {
      font-size: 32px;
      margin: 0 0 20px;
    }

    #dashboardMarketGrid {
      display: grid;

      grid-template-columns:
        repeat(6, minmax(160px, 1fr));

      gap: 15px;
    }

    .market-card {
      background: #080e1b;

      border: 1px solid #1c2940;

      border-radius: 14px;

      padding: 18px;

      min-height: 185px;
    }

    .market-header {
      display: flex;

      align-items: center;

      gap: 11px;
    }

    .market-logo {
      width: 42px;
      height: 42px;

      border-radius: 50%;
    }

    .market-name {
      font-weight: 700;

      font-size: 16px;
    }

    .market-symbol {
      color: #8e9bb4;

      font-size: 13px;

      margin-top: 3px;
    }

    .market-price {
      font-size: 23px;

      font-weight: 700;

      margin-top: 25px;
    }

    .market-change {
      margin-top: 8px;

      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 1100px) {

      #dashboardMarketGrid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

    @media (max-width: 800px) {

      header {
        min-height: 80px;
        padding: 14px 20px;
      }

      .brand {
        gap: 12px;
      }

      .oex-logo {
        width: 44px;
        height: 44px;
        gap: 5px;
      }

      .brand-divider {
        height: 42px;
      }

      .brand-name {
        font-size: 24px;
      }

      .logout-button {
        padding: 10px 15px;
        font-size: 14px;
      }

      main {
        padding: 0 15px 40px;
      }

      #userName {
        font-size: 40px;
      }

      .balance-grid {
        grid-template-columns: 1fr;
      }

      #dashboardMarketGrid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .referral-content {
        align-items: flex-start;
      }

      .referral-link-box {
        flex-direction: column;
      }

      .referral-link-box .action-button {
        width: 100%;
      }

    }

    @media (max-width: 500px) {

      .brand-name {
        font-size: 20px;
      }

      .brand-divider {
        display: none;
      }

      .logout-button {
        padding: 9px 12px;
      }

      .card {
        padding: 20px;
      }

      #userName {
        font-size: 32px;
      }

      .balance {
        font-size: 29px;
      }

      .action-title {
        font-size: 27px;
      }

      .action-button {
        width: 100%;
        margin-top: 8px;
      }

      #dashboardMarketGrid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>


<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="brand">

      <div class="oex-logo">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="brand-divider"></div>

      <div class="brand-name">
        OEX Crypto
      </div>

    </div>


    <button
      class="logout-button"
      onclick="logout()">

      Log Out

    </button>

  </header>


  <main>

    <!-- =========================
         USER
    ========================= -->

    <section class="card user-card">

      <div class="welcome">
        Welcome
      </div>

      <h1 id="userName">
        OEX User
      </h1>

      <div
        id="userEmail"
        class="muted">
      </div>

    </section>


    <!-- =========================
         BALANCES
    ========================= -->

    <section class="card">

      <div class="balance-grid">

        <div class="balance-box">

          <div class="balance-label">
            USDT Balance
          </div>

          <div
            id="usdtBalance"
            class="balance">

            0.000000 USDT

          </div>

        </div>


        <div class="balance-box">

          <div class="balance-label">
            ETH Balance
          </div>

          <div
            id="ethBalance"
            class="balance">

            0.000000 ETH

          </div>

        </div>

      </div>

    </section>


    <!-- =========================
         USDT
    ========================= -->

    <section class="card">

      <div class="action-header">

        <div class="usdt-icon">
          T
        </div>

        <div class="action-title">
          USDT
        </div>

        <button
          class="action-button"
          onclick="showRecharge()">

          Recharge

        </button>

        <button
          class="action-button"
          onclick="showWithdrawal()">

          Withdrawal

        </button>

      </div>


      <div id="actionArea"></div>

    </section>


    <!-- =========================
         REFERRAL
    ========================= -->

    <section class="card referral-card">

      <div class="referral-content">

        <div class="referral-icon">
          %
        </div>

        <div class="referral-text">

          <h2>
            REFERRAL
          </h2>

          <h3>
            Invite friends and earn commission
          </h3>

          <p class="muted">
            Invite friends and receive up to 20%
            referral commission on eligible fees.
          </p>

        </div>

      </div>


      <div class="referral-link-box">

        <input
          id="referralLink"
          type="text"
          value="https://oex-crypto.vercel.app/signup?rf=0EX-CCA701F7"
          readonly
        >

        <button
          class="action-button"
          onclick="copyReferralLink()">

          Copy Link

        </button>

      </div>


      <div class="referral-code">

        <span class="muted">
          Code:
        </span>

        <strong>
          OEX-CCA701F7
        </strong>

      </div>

    </section>


    <!-- =========================
         MARKET PRICES
    ========================= -->

    <section class="card">

      <h2 class="market-title">
        ↗ Market Prices
      </h2>

      <div id="dashboardMarketGrid">

        Loading market prices...

      </div>

    </section>

  </main>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>


  <script>

    /* ==========================================
       SUPABASE CONFIGURATION
    ========================================== */

    const SUPABASE_URL =
      "https://fnyxxyohuywtatbjagyc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_A3iHoZiiPZhPyTUDUDCfZQ_G0u6xvxj";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ==========================================
       RECHARGE
    ========================================== */

    function showRecharge() {

      document.getElementById(
        "actionArea"
      ).innerHTML = `

        <h3>
          Recharge USDT
        </h3>

        <p class="muted">
          Send USDT to the address below.
        </p>

        <div class="address-box">
          0x6633c904fbb69ee62fc7209eca05a9152ed490fa
        </div>

        <p class="muted">
          Make sure you send USDT on the correct network.
        </p>

        <p class="muted">
          Your balance should only be credited after
          the transaction has been verified.
        </p>

      `;
    }


    /* ==========================================
       WITHDRAWAL
    ========================================== */

    function showWithdrawal() {

      document.getElementById(
        "actionArea"
      ).innerHTML = `

        <h3>
          Withdrawal
        </h3>

        <p class="muted">
          Enter the destination address and amount.
        </p>

        <input
          id="withdrawAddress"
          type="text"
          placeholder="Destination address"
        >

        <input
          id="withdrawAmount"
          type="number"
          min="0"
          step="0.000001"
          placeholder="Amount USDT"
        >

        <p class="muted">
          Network fee will be calculated when
          the withdrawal is processed.
        </p>

        <button
          class="action-button"
          onclick="submitWithdrawal()">

          Submit Withdrawal

        </button>

      `;
    }


    /* ==========================================
       WITHDRAWAL SUBMISSION
    ========================================== */

    function submitWithdrawal() {

      const address =
        document.getElementById(
          "withdrawAddress"
        ).value.trim();


      const amount =
        document.getElementById(
          "withdrawAmount"
        ).value;


      if (!address) {

        alert(
          "Please enter a destination address."
        );

        return;
      }


      if (
        !amount ||
        Number(amount) <= 0
      ) {

        alert(
          "Please enter a valid amount."
        );

        return;
      }


      alert(
        "Withdrawal request received."
      );

    }


    /* ==========================================
       REFERRAL COPY
    ========================================== */

    async function copyReferralLink() {

      const referralInput =
        document.getElementById(
          "referralLink"
        );

      const referralLink =
        referralInput.value;


      try {

        await navigator.clipboard.writeText(
          referralLink
        );


        const button =
          document.querySelector(
            ".referral-link-box .action-button"
          );


        const originalText =
          button.textContent;


        button.textContent =
          "Copied!";


        setTimeout(() => {

          button.textContent =
            originalText;

        }, 2000);


      } catch (error) {

        /* Fallback for older browsers */

        referralInput.select();

        document.execCommand(
          "copy"
        );


        alert(
          "Referral link copied!"
        );

      }

    }


    /* ==========================================
       LOAD USER
    ========================================== */

    async function loadUser() {

      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient
            .auth
            .getUser();


        if (!user) {

          window.location.href =
            "/oex-crypto/";

          return;
        }


        document.getElementById(
          "userEmail"
        ).textContent =
          user.email || "";


        document.getElementById(
          "userName"
        ).textContent =
          user.user_metadata?.display_name ||
          "OEX User";


        /* ===============================
           LOAD BALANCES
        =============================== */

        const {
          data: balances,
          error
        } =
          await supabaseClient
            .from("balances")
            .select(`
              amount,
              coin_id,
              coins (
                symbol
              )
            `)
            .eq(
              "user_id",
              user.id
            );


        if (error) {

          console.error(
            "Balance error:",
            error
          );

          return;
        }


        let usdtBalance = 0;
        let ethBalance = 0;


        balances.forEach(
          balance => {

            const symbol =
              balance.coins?.symbol;


            if (symbol === "USDT") {

              usdtBalance =
                Number(balance.amount);

            }


            if (symbol === "ETH") {

              ethBalance =
                Number(balance.amount);

            }

          }
        );


        document.getElementById(
          "usdtBalance"
        ).textContent =
          usdtBalance.toFixed(6) +
          " USDT";


        document.getElementById(
          "ethBalance"
        ).textContent =
          ethBalance.toFixed(6) +
          " ETH";

      }

      catch (error) {

        console.error(
          "User loading error:",
          error
        );

      }

    }


    /* ==========================================
       LOGOUT
    ========================================== */

    async function logout() {

      try {

        await supabaseClient
          .auth
          .signOut();

      }

      catch (error) {

        console.error(
          "Logout error:",
          error
        );

      }


      window.location.href =
        "/oex-crypto/";

    }


    /* ==========================================
       MARKET COINS
    ========================================== */

    const dashboardCoins = [

      {
        id: "bitcoin",
        name: "Bitcoin",
        symbol: "BTC"
      },

      {
        id: "ethereum",
        name: "Ethereum",
        symbol: "ETH"
      },

      {
        id: "tether",
        name: "Tether",
        symbol: "USDT"
      },

      {
        id: "binancecoin",
        name: "BNB",
        symbol: "BNB"
      },

      {
        id: "solana",
        name: "Solana",
        symbol: "SOL"
      },

      {
        id: "usd-coin",
        name: "USD Coin",
        symbol: "USDC"
      }

    ];


    /* ==========================================
       MARKET PRICES
    ========================================== */

    async function loadDashboardMarketPrices() {

      const grid =
        document.getElementById(
          "dashboardMarketGrid"
        );


      if (!grid) {
        return;
      }


      try {

        const ids =
          dashboardCoins
            .map(
              coin => coin.id
            )
            .join(",");


        const response =
          await fetch(

            "/api/market-prices" +

            "?vs_currency=usd" +

            "&ids=" +
            encodeURIComponent(ids) +

            "&order=market_cap_desc" +

            "&per_page=20" +

            "&page=1" +

            "&sparkline=false" +

            "&price_change_percentage=24h"

          );


        if (!response.ok) {

          throw new Error(
            "Market price API unavailable"
          );

        }


        const data =
          await response.json();


        grid.innerHTML = "";


        if (
          !Array.isArray(data) ||
          data.length === 0
        ) {

          grid.innerHTML =
            "<p class='muted'>Market prices unavailable.</p>";

          return;
        }


        data.forEach(
          coin => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "market-card";


            const change =
              Number(
                coin.price_change_percentage_24h || 0
              );


            card.innerHTML = `

              <div class="market-header">

                <img
                  class="market-logo"
                  src="${coin.image}"
                  alt="${coin.name}"
                >

                <div>

                  <div class="market-name">
                    ${coin.name}
                  </div>

                  <div class="market-symbol">
                    ${coin.symbol.toUpperCase()}
                  </div>

                </div>

              </div>


              <div class="market-price">
                $${Number(
                  coin.current_price
                ).toLocaleString()}
              </div>


              <div class="market-change">

                24h:
                ${change.toFixed(2)}%

              </div>

            `;


            grid.appendChild(card);

          }
        );

      }

      catch (error) {

        console.error(
          "Market prices error:",
          error
        );


        grid.innerHTML = `
          <p class="muted">
            Market prices unavailable.
          </p>
        `;

      }

    }


    /* ==========================================
       START DASHBOARD
    ========================================== */

    loadUser();


    window.addEventListener(
      "load",
      loadDashboardMarketPrices
    );


    setInterval(
      loadDashboardMarketPrices,
      60000
    );

  </script>

</body>

</html>
```
